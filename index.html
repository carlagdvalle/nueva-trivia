<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Kawaii • Desafío de Cultura General</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Quicksand & Zen Maru Gothic para un toque japonés suave y redondeado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', '"Quicksand"', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFDF9',
                            100: '#FDF8F0',
                            200: '#F7EFE2',
                        },
                        sakura: {
                            100: '#FFE8EE',
                            200: '#FFD1DD',
                            300: '#FFB3C6',
                            400: '#FF8FA3',
                            500: '#FB6F92',
                        },
                        matcha: {
                            100: '#EBF5EC',
                            200: '#D4E8D6',
                            300: '#B5D6B8',
                            400: '#8FBC94',
                            500: '#6B9E70',
                        },
                        cocoa: {
                            600: '#6D5D55',
                            700: '#52443E',
                            800: '#3D312C',
                        }
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.92)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FDF8F0;
            background-image: radial-gradient(#FFD1DD 1px, transparent 1px), radial-gradient(#D4E8D6 1px, #FDF8F0 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            color: #52443E;
            -webkit-tap-highlight-color: transparent;
        }

        .kawaii-card {
            background: rgba(255, 253, 249, 0.96);
            backdrop-filter: blur(8px);
            border: 2px solid #F7EFE2;
            box-shadow: 0 12px 30px -10px rgba(109, 93, 85, 0.12);
        }

        .btn-kawaii {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-kawaii:active {
            transform: scale(0.96);
        }

        #timer-bar {
            transition: width 0.1s linear, background-color 0.3s ease;
        }
    </style>
</head>

            </p>
